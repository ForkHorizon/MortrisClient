plugins { id "com.android.application" }
android {
    namespace "bench"
    compileSdk 35
    buildToolsVersion "36.0.0"
    defaultConfig { applicationId "bench.sdk"; minSdk 25; targetSdk 34; versionCode 1; versionName "1" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies {
    // Pinned third-party SDK binaries are copied to ../libs by fetch_sdks.sh (SHA256SUMS checked in).
    implementation "com.google.firebase:firebase-analytics:23.0.0"
    implementation "com.adjust.sdk:adjust-android:5.4.1"
    implementation "com.facebook.android:facebook-core:17.0.2"
    implementation fileTree(dir: "../../libs", include: ["*.jar", "*.aar"], exclude: ["*kotlin-stdlib*", "org.jetbrains.annotations*"])
}
